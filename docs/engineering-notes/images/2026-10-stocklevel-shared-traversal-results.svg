<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title description">
  <title id="title">StockLevel sorted batch lookup and shared traversal results</title>
  <desc id="description">Comparison of StockLevel latency, stock-index page pins, and sampled stock-index traversal share after page-level binary search and after shared traversal.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; }
    .title { font-size: 17px; font-weight: 600; }
    .axis { font-size: 11px; }
    .value { font-size: 11px; font-weight: 600; }
    .legend { font-size: 13px; }
    .grid { stroke: #d9dee5; stroke-width: 1; }
    .baseline { stroke: #aab2bc; stroke-width: 1; }
    .binary { fill: #8a96a3; }
    .shared { fill: #2e6fbb; }
  </style>
  <rect width="1100" height="430" fill="#ffffff"/>

  <text class="title" x="35" y="32">StockLevel controlled latency</text>
  <text class="axis" x="15" y="205" transform="rotate(-90 15 205)">Latency (ms)</text>
  <line class="grid" x1="55" y1="104" x2="370" y2="104"/>
  <line class="grid" x1="55" y1="217" x2="370" y2="217"/>
  <line class="baseline" x1="55" y1="330" x2="370" y2="330"/>
  <text class="axis" x="47" y="334" text-anchor="end">0</text>
  <text class="axis" x="47" y="221" text-anchor="end">100</text>
  <text class="axis" x="47" y="108" text-anchor="end">200</text>

  <rect class="binary" x="78" y="273.7" width="22" height="56.3"/>
  <rect class="shared" x="104" y="279.7" width="22" height="50.3"/>
  <text class="value" x="89" y="266" text-anchor="middle">49.8</text>
  <text class="value" x="115" y="272" text-anchor="middle">44.5</text>
  <text class="axis" x="102" y="350" text-anchor="middle">Median</text>

  <rect class="binary" x="151" y="261.5" width="22" height="68.5"/>
  <rect class="shared" x="177" y="266.2" width="22" height="63.8"/>
  <text class="value" x="162" y="254" text-anchor="middle">60.6</text>
  <text class="value" x="188" y="258" text-anchor="middle">56.5</text>
  <text class="axis" x="175" y="350" text-anchor="middle">P75</text>

  <rect class="binary" x="224" y="217.8" width="22" height="112.2"/>
  <rect class="shared" x="250" y="221.0" width="22" height="109.0"/>
  <text class="value" x="235" y="210" text-anchor="middle">99.2</text>
  <text class="value" x="261" y="213" text-anchor="middle">96.4</text>
  <text class="axis" x="248" y="350" text-anchor="middle">P95</text>

  <rect class="binary" x="297" y="86.5" width="22" height="243.5"/>
  <rect class="shared" x="323" y="215.1" width="22" height="114.9"/>
  <text class="value" x="308" y="79" text-anchor="middle">215.5</text>
  <text class="value" x="334" y="207" text-anchor="middle">101.6</text>
  <text class="axis" x="321" y="350" text-anchor="middle">P99</text>

  <text class="title" x="405" y="32">Median stock-index page pins</text>
  <text class="axis" x="390" y="205" transform="rotate(-90 390 205)">Pins per StockLevel</text>
  <line class="grid" x1="425" y1="85" x2="740" y2="85"/>
  <line class="grid" x1="425" y1="208" x2="740" y2="208"/>
  <line class="baseline" x1="425" y1="330" x2="740" y2="330"/>
  <text class="axis" x="417" y="334" text-anchor="end">0</text>
  <text class="axis" x="417" y="212" text-anchor="end">400</text>
  <text class="axis" x="417" y="89" text-anchor="end">800</text>

  <rect class="binary" x="455" y="87.0" width="28" height="243.0"/>
  <rect class="shared" x="489" y="278.6" width="28" height="51.4"/>
  <text class="value" x="469" y="79" text-anchor="middle">794.5</text>
  <text class="value" x="503" y="271" text-anchor="middle">168</text>
  <text class="axis" x="486" y="350" text-anchor="middle">All pages</text>

  <rect class="binary" x="555" y="209.0" width="28" height="121.0"/>
  <rect class="shared" x="589" y="327.2" width="28" height="2.8"/>
  <text class="value" x="569" y="201" text-anchor="middle">395.5</text>
  <text class="value" x="603" y="319" text-anchor="middle">9</text>
  <text class="axis" x="586" y="350" text-anchor="middle">Internal</text>

  <rect class="binary" x="655" y="207.9" width="28" height="122.1"/>
  <rect class="shared" x="689" y="281.4" width="28" height="48.6"/>
  <text class="value" x="669" y="200" text-anchor="middle">399</text>
  <text class="value" x="703" y="273" text-anchor="middle">159</text>
  <text class="axis" x="686" y="350" text-anchor="middle">Leaf</text>

  <text class="title" x="785" y="32">Stock-index traversal share</text>
  <text class="axis" x="765" y="205" transform="rotate(-90 765 205)">Join sampled weight (%)</text>
  <line class="grid" x1="800" y1="94" x2="1070" y2="94"/>
  <line class="grid" x1="800" y1="212" x2="1070" y2="212"/>
  <line class="baseline" x1="800" y1="330" x2="1070" y2="330"/>
  <text class="axis" x="792" y="334" text-anchor="end">0</text>
  <text class="axis" x="792" y="216" text-anchor="end">25</text>
  <text class="axis" x="792" y="98" text-anchor="end">50</text>

  <rect class="binary" x="875" y="96.8" width="48" height="233.2"/>
  <rect class="shared" x="945" y="171.6" width="48" height="158.4"/>
  <text class="value" x="899" y="89" text-anchor="middle">49.32%</text>
  <text class="value" x="969" y="164" text-anchor="middle">33.50%</text>
  <text class="axis" x="899" y="350" text-anchor="middle">Per key</text>
  <text class="axis" x="969" y="350" text-anchor="middle">Shared</text>

  <rect class="binary" x="405" y="392" width="16" height="12"/>
  <text class="legend" x="428" y="403">Page binary search</text>
  <rect class="shared" x="585" y="392" width="16" height="12"/>
  <text class="legend" x="608" y="403">+ sorted batch lookup and shared traversal</text>
</svg>
